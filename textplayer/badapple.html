<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bad Apple - ASCII</title>

<!-- The link-preview card. Twitter/X only ever shows a static image (and caps
     it at 5MB), so it gets a good frame as a PNG; og:image is a downsized
     animated cut of the projects-page gif, which Discord and Telegram animate.
     Absolute URLs: scrapers do not resolve relative ones. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Bad Apple - ASCII">
<meta property="og:description" content="The Bad Apple music video converted to ASCII text, played frame-by-frame in the browser. Every frame is selectable text.">
<meta property="og:url" content="https://pzpzpzp1.github.io/textplayer/badapple.html">
<meta property="og:image" content="https://pzpzpzp1.github.io/assets/textplayer_embed.gif?v=2">
<meta property="og:image:type" content="image/gif">
<meta property="og:image:width" content="480">
<meta property="og:image:height" content="357">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Bad Apple - ASCII">
<meta name="twitter:description" content="The Bad Apple music video converted to ASCII text, played frame-by-frame in the browser.">
<meta name="twitter:image" content="https://pzpzpzp1.github.io/assets/textplayer_card.png?v=2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230e1013'/%3E%3Ctext x='8' y='12' font-family='monospace' font-size='12' fill='%23ffb454' text-anchor='middle'%3E%24%3C/text%3E%3C/svg%3E">
<!-- Versioned so a stale copy in someone's cache cannot be reused after a change.
     serve.py sends no-store, but a browser that cached these before it existed will
     not ask again on its own. -->
<link rel="stylesheet" href="style.css?v=7">

<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-9QP4R91BX5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-9QP4R91BX5');
</script>
</head>
<body>

<header>
  <h1>Bad Apple - ASCII: <a href="https://pzpzpzp1.github.io/asciilab/">How it's made</a></h1>
  <p class="sub" id="sub">loading&hellip;</p>
</header>

<main>
  <!-- The box is fixed on screen and its interior is exactly the video frame: the
       svg's viewBox is set to the crop rectangle, so the same region fills it no
       matter what the frame's scale is. Nothing is cropped -- the padding the
       renderer cut off is still drawn, and simply falls outside the box. -->
  <div class="stage">
    <div class="frame" id="frame">
      <svg id="art" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="cropbox"></div>
    </div>
  </div>
</main>

<footer>
  <div class="transport">
    <button id="play" class="primary" disabled>Play</button>
    <button id="back" disabled>&laquo; 1</button>
    <button id="fwd" disabled>1 &raquo;</button>
    <button id="copy" disabled title="Copy this frame's text">Copy frame</button>
    <button id="selectText" disabled title="Open this frame as selectable text">Select text</button>
    <label class="check"><input type="checkbox" id="loop" checked> loop</label>
    <span class="spacer"></span>
    <label class="check" for="veilOpacity">center-crop veil</label>
    <input id="veilOpacity" type="range" min="0" max="1" step="0.01" value="0.8"
           aria-label="Center-crop veil opacity">
    <button id="mute" title="Mute (m)">Vol</button>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"
           aria-label="Volume">
  </div>

  <!-- The music doubles as the clock: frames are read off its currentTime, so a
       long play cannot drift against it. -->
  <audio id="snd" preload="auto"></audio>

  <input id="seek" type="range" min="0" max="0" value="0" step="1" disabled
         aria-label="Seek">

  <div class="readout">
    <span class="big" id="frameNum">0</span>
    <span class="dim" id="time"></span>
    <span class="spacer"></span>
    <span class="dim" id="geom"></span>
  </div>
</footer>

<!-- The current frame as real text. The video's glyphs are svg text, which no
     mobile browser lets you drag-select; this overlay is plain HTML text, so
     native selection works on it everywhere. -->
<div class="textview" id="textview" hidden>
  <div class="textview-head">
    <span id="tvLabel"></span>
    <span class="spacer"></span>
    <button id="tvClose">Close</button>
  </div>
  <pre id="tvPre"></pre>
</div>

<script src="app.js?v=7"></script>
</body>
</html>
